kind = "web"
previewPath = "/"
title = "Campus Tag"
description = "A campus lost-and-found app where owners register belongings and share scannable QR tags, while finders can contact the owner privately without seeing their contact details."
version = "1.0.0"
id = "artifacts/campus-tag"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21440

[services.development]
run = "pnpm --filter @workspace/campus-tag run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-tag", "run", "build" ]
serve = "static"
publicDir = "artifacts/campus-tag/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21440"
BASE_PATH = "/"
