version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campustag_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-campustag_db}
      POSTGRES_USER: ${DB_USER:-campustag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campustag_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campustag_user} -d ${DB_NAME:-campustag_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campustag_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campustag_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_super_admin &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-campus-tag-production-secret-key}
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      DB_NAME: ${DB_NAME:-campustag_db}
      DB_USER: ${DB_USER:-campustag_user}
      DB_PASSWORD: ${DB_PASSWORD:-campustag_secure_password}
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  media_data:
