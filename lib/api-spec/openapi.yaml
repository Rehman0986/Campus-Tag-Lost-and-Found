openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: items
    description: Owner item management
  - name: finder
    description: Public QR-code finder flows
  - name: notifications
    description: Owner notifications
  - name: storage
    description: Item photo uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [items]
      summary: Get the owner's dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List the owner's items
      responses:
        "200":
          description: Owner items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      tags: [items]
      summary: Register an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Item registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /items/{id}:
    get:
      operationId: getItem
      tags: [items]
      summary: Get one of the owner's items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update item status or lost mode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /items/{id}/messages:
    get:
      operationId: listItemMessages
      tags: [items]
      summary: List messages for one of the owner's items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Item messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemMessage"
  /items/{id}/location:
    post:
      operationId: updateItemLocation
      tags: [items]
      summary: Manually update an item's last seen location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the owner's notifications
      responses:
        "200":
          description: Owner notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemNotification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemNotification"
  /find/{publicId}:
    get:
      operationId: getPublicItem
      tags: [finder]
      summary: Get the public item details for a QR code
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public item details without owner contact information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicItem"
        "404":
          description: QR code not found
  /find/{publicId}/reports:
    post:
      operationId: submitFinderReport
      tags: [finder]
      summary: Send a private finder message to the owner
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinderReportInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinderReportResponse"
        "404":
          description: QR code not found
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private item photo upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Upload destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrl"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Stream a registered item photo
      description: Only object paths attached to registered items are served.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Encoded object path within the private upload bucket.
      responses:
        "200":
          description: The registered item photo
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Item:
      type: object
      required: [id, name, description, category, status, lostMode, publicId, photoPath, locationLabel, latitude, longitude, locationReportedAt, locationSource, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [Bottle, Bag, Keys, Wallet, Electronics, Other] }
        status: { type: string, enum: [active, lost, recovered] }
        lostMode: { type: boolean }
        publicId: { type: string }
        photoPath: { type: [string, "null"] }
        locationLabel: { type: [string, "null"] }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        locationReportedAt: { type: [string, "null"], format: date-time }
        locationSource: { type: [string, "null"], enum: [owner, finder, null] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicItem:
      type: object
      required: [name, description, category, status, photoPath]
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [Bottle, Bag, Keys, Wallet, Electronics, Other] }
        status: { type: string, enum: [active, lost, recovered] }
        photoPath: { type: [string, "null"] }
    ItemInput:
      type: object
      required: [name, description, category]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        category: { type: string, enum: [Bottle, Bag, Keys, Wallet, Electronics, Other] }
        photoPath: { type: [string, "null"] }
    ItemUpdate:
      type: object
      properties:
        status: { type: string, enum: [active, lost, recovered] }
        lostMode: { type: boolean }
    ItemMessage:
      type: object
      required: [id, itemId, senderType, senderName, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        senderType: { type: string, enum: [owner, finder] }
        senderName: { type: [string, "null"] }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    ItemNotification:
      type: object
      required: [id, itemId, itemName, message, isRead, createdAt]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [totalItems, activeItems, lostItems, recoveredItems, unreadNotifications, recentReports]
      properties:
        totalItems: { type: integer }
        activeItems: { type: integer }
        lostItems: { type: integer }
        recoveredItems: { type: integer }
        unreadNotifications: { type: integer }
        recentReports:
          type: array
          items: { $ref: "#/components/schemas/ItemMessage" }
    LocationInput:
      type: object
      required: [locationLabel]
      properties:
        locationLabel: { type: string, minLength: 1, maxLength: 240 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
    FinderReportInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        finderName: { type: [string, "null"], maxLength: 120 }
        shareLocation: { type: boolean }
        locationLabel: { type: [string, "null"], maxLength: 240 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
    FinderReportResponse:
      type: object
      required: [success, itemRecovered]
      properties:
        success: { type: boolean }
        itemRecovered: { type: boolean }
    UploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    UploadUrl:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadRequest"

